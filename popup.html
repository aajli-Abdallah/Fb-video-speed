<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Facebook Video Speed</title>
  <style>
    body {
      width: 220px;
      font-family: Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background: #fff;
      color: #050505;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #1877f2;
    }
    p {
      font-size: 12px;
      color: #65676b;
      margin: 0 0 10px;
    }
    .speeds {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    button {
      background: #f0f2f5;
      border: none;
      border-radius: 6px;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #050505;
    }
    button:hover {
      background: #e4e6eb;
    }
    button.active {
      background: #1877f2;
      color: #fff;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #8a8d91;
    }
  </style>
</head>
<body>
  <h1>Facebook Video Speed</h1>
  <p>Default speed for videos on Facebook. Applies automatically as videos load.</p>
  <div class="speeds" id="speeds"></div>
  <div class="hint">Tip: you can also click the speed buttons that appear on top of each video.</div>
  <script src="popup.js"></script>
</body>
</html>
